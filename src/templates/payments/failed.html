<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Failed</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  background:linear-gradient(135deg,#ff512f,#dd2476);
}

.container{
  background:white;
  padding:35px 25px;
  border-radius:14px;
  text-align:center;
  max-width:420px;
  width:92%;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.icon{
  font-size:70px;
  color:#ff4d4f;
  margin-bottom:18px;
  animation: pop 0.5s ease-out, shake 0.6s ease-in-out 0.5s;
}

h1{
  font-size:24px;
  margin-bottom:10px;
  color:#333;
}

p{
  font-size:15px;
  color:#666;
  margin-bottom:20px;
  line-height:1.5;
}

.footer{
  margin-top:15px;
  font-size:12px;
  color:#999;
}

/* POP EFFECT */
@keyframes pop{
  0%{
    transform:scale(0);
    opacity:0;
  }
  80%{
    transform:scale(1.2);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* SHAKE EFFECT */
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

</style>

</head>

<body>

<div class="container">

<div class="icon">❌</div>

<h1>Payment Failed</h1>

<p>
Unfortunately your payment could not be processed.<br>
Please try again or use a different payment method.
</p>

<div class="footer">
If the issue continues, please contact support.
</div>

</div>

</body>
</html>
