<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  background:linear-gradient(135deg,#00c853,#64dd17);
}

.container{
  background:white;
  padding:35px 25px;
  border-radius:14px;
  text-align:center;
  max-width:420px;
  width:92%;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.icon{
  font-size:70px;
  color:#28a745;
  margin-bottom:15px;
  animation: pop 0.6s ease-out, pulse 2s infinite 0.6s;
}

h1{
  font-size:24px;
  margin-bottom:10px;
  color:#333;
}

p{
  font-size:15px;
  color:#666;
  margin-bottom:25px;
  line-height:1.5;
}

button{
  background:#28a745;
  color:white;
  border:none;
  padding:12px 28px;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#1f8a38;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#999;
}

/* POP ANIMATION */
@keyframes pop{
  0%{
    transform:scale(0);
    opacity:0;
  }
  80%{
    transform:scale(1.2);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* PULSE ANIMATION */
@keyframes pulse{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
  }
}

</style>
</head>

<body>

<div class="container">

<div class="icon">✅</div>

<h1>Payment Successful</h1>

<p>
Your payment has been completed successfully.  
You can safely return to the app.
</p>


<div class="footer">
You may close this page now.
</div>

</div>

</body>
</html>
