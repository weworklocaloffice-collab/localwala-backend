<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Successful</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  background:linear-gradient(135deg,#43cea2,#185a9d);
}

.container{
  background:white;
  padding:35px 25px;
  border-radius:14px;
  text-align:center;
  max-width:420px;
  width:92%;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.icon{
  font-size:70px;
  color:#28a745;
  margin-bottom:18px;
  animation: pop 0.6s ease-out, pulse 2s infinite 0.6s;
}

h1{
  font-size:24px;
  margin-bottom:10px;
  color:#333;
}

p{
  font-size:15px;
  color:#666;
  margin-bottom:20px;
  line-height:1.5;
}

.footer{
  margin-top:15px;
  font-size:12px;
  color:#999;
}

/* POP ANIMATION */

@keyframes pop{
  0%{
    transform:scale(0);
    opacity:0;
  }
  80%{
    transform:scale(1.2);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* PULSE ANIMATION */

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

</style>

</head>

<body>

<div class="container">

<div class="icon">✅</div>

<h1>Verification Successful</h1>

<p>
Your verification has been completed successfully.<br>
You can now continue using the application.
</p>

<div class="footer">
Thank you for verifying your account.
</div>

</div>

</body>
</html>
